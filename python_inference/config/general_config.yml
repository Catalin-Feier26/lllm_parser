# Reference template for a source-specific inference configuration.
# Copy this file, rename it for a municipality/source, and replace placeholders.

source:
  name: source_name

  # Preferred after Perl has loaded source_files, parser_runs and raw_permits.
  input:
    type: mongo
    collection: raw_permits
    parser_runs_collection: parser_runs
    uri_env: MONGO_URI
    database_env: MONGO_DB_NAME
    server_selection_timeout_ms: 5000

    # Used to automatically select the latest completed parser run.
    parser_run_filter:
      source.state: STATE
      source.county: County
      parser.config_module: Config::Parser::source_config_module

    # Applied after parser_run_id has been selected.
    raw_permits_filter:
      source.state: STATE
      source.county: County
      source.municipality: Municipality

  # For CSV-only experiments, replace input above with:
  # input:
  #   type: csv
  #   path: data/archive/example.csv

output:
  base_dir: python_inference/output

  # Store evaluation or production runs, algorithm candidates, merged decisions,
  # and the complete production snapshot in MongoDB.
  mongo:
    enabled: true
    uri_env: MONGO_URI
    database_env: MONGO_DB_NAME
    server_selection_timeout_ms: 5000

    collections:
      inference_runs: inference_runs
      inference_predictions: inference_predictions
      inference_decisions: inference_decisions
      final_permits: final_permits

inference:
  # Use evaluation for reproducible masking and metrics.
  # Use production to fill genuinely missing values and create final_permits.
  mode: evaluation

preprocessing:
  normalize_strings: true

  # Preserve raw_permit_id and parser_run_id so predictions can later be
  # written back to MongoDB with row-level provenance.
  keep_columns:
    - raw_permit_id
    - parser_run_id
    - record_id
    - target_column
    - categorical_feature
    - numeric_feature

  engineered_features:
    valuation_bucket:
      enabled: false
      source_col: valuation
      output_col: valuation_bucket

    total_units_group:
      enabled: false
      source_col: total_units
      output_col: total_units_group

    total_sf_nonzero:
      enabled: false
      source_col: total_sf
      output_col: total_sf_nonzero

inference_targets:
  target_column:
    enabled: true

    cleaning:
      source_col: target_column
      clean_col: target_column_clean
      missing_values:
        - Not Identified
        - Unknown
      replacements: {}

    # Evaluation mode hides a reproducible subset of known values.
    # Production mode instead selects genuinely missing cleaned values.
    masking:
      source_col: target_column_clean
      target_col: target_input
      true_col: target_true
      mask_col: is_masked
      mask_rate: 0.20
      seed: 42

    feature_cols:
      - categorical_feature

    algorithms:
      grouped_majority:
        enabled: true
        output_folder: baseline
        group_levels:
          - [categorical_feature]

      association_rules:
        enabled: true
        output_folder: association_rules
        min_support: 0.01
        min_confidence: 0.50
        min_lift: 1.00
        use_global_fallback: true
        top_n_rules: 50

      clustering:
        enabled: true
        output_folder: clustering
        n_clusters: 8
        random_state: 42
        n_init: 10

      knn:
        enabled: true
        output_folder: knn
        n_neighbors: 5
        weights: distance

    merge:
      enabled: true
      output_folder: merged
      strategy: majority_then_confidence
      minimum_confidence: 0.0
      record_id_col: raw_permit_id

plots:
  confusion_matrix:
    xlabel: Predicted label
    ylabel: True label
    figure_width: 8
    figure_height: 6
    dpi: 150
    x_label_rotation: 30
