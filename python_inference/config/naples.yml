source:
  name: naples

  # Load the latest completed Naples parser run from MongoDB by default.
  # MONGO_URI and MONGO_DB_NAME are the same environment variables used by Perl.
  input:
    type: mongo
    collection: raw_permits
    parser_runs_collection: parser_runs
    uri_env: MONGO_URI
    database_env: MONGO_DB_NAME
    server_selection_timeout_ms: 5000

    parser_run_filter:
      source.state: FL
      source.county: Collier
      parser.config_module: Config::Parser::fl_collier_naples_xlsx

    raw_permits_filter:
      source.state: FL
      source.county: Collier
      source.municipality: Naples

output:
  base_dir: python_inference/output

  mongo:
    enabled: true
    uri_env: MONGO_URI
    database_env: MONGO_DB_NAME
    server_selection_timeout_ms: 5000

    collections:
      inference_runs: inference_runs
      inference_predictions: inference_predictions
      inference_decisions: inference_decisions
      validation_results: validation_results
      final_permits: final_permits

inference:
  mode: evaluation

preprocessing:
  normalize_strings: true

  # Keep provenance columns alongside algorithm features. This makes every
  # prepared row and every prediction traceable to its original raw permit.
  keep_columns:
    - raw_permit_id
    - parser_run_id
    - input_file_id
    - output_csv_file_id
    - csv_row_number
    - permit_number
    - building_type
    - permit_type
    - const_type
    - valuation
    - total_sf
    - total_units
    - permit_class

  normalization:
    enabled: true
    suffix: _normalized
    missing_values:
      - Not Identified
      - N/A
      - NA
      - NONE
      - "-"

    fields:
      permit_number:
        type: identifier
        required: true

      building_type:
        type: text

      permit_type:
        type: text

      const_type:
        type: text

      valuation:
        type: money
        normalized_col: valuation_normalized
        min: 0
        suspicious_max: 10000000

      total_sf:
        type: number
        normalized_col: total_sf_normalized
        min: 0
        suspicious_max: 1000000

      total_units:
        type: integer
        normalized_col: total_units_normalized
        min: 0
        suspicious_max: 10000

      permit_class:
        type: text
        missing_values:
          - Not Identified

  validation:
    enabled: true
    output_col: validation
    status_prefix: validation_
    important_fields:
      - permit_number
      - building_type
      - permit_type
      - permit_class
    missing_values:
      - Not Identified
      - N/A
      - NA
      - NONE
      - "-"

    fields:
      permit_number:
        type: identifier
        required: true

      building_type:
        type: text

      permit_type:
        type: text

      const_type:
        type: text

      valuation:
        type: money
        min: 0
        suspicious_max: 10000000

      total_sf:
        type: number
        min: 0
        suspicious_max: 1000000

      total_units:
        type: integer
        min: 0
        suspicious_max: 10000

      permit_class:
        type: text
        missing_values:
          - Not Identified

  engineered_features:
    valuation_bucket:
      enabled: true
      source_col: valuation_normalized
      output_col: valuation_bucket

    total_units_group:
      enabled: true
      source_col: total_units_normalized
      output_col: total_units_group

    total_sf_nonzero:
      enabled: true
      source_col: total_sf_normalized
      output_col: total_sf_nonzero

inference_targets:
  permit_class:
    enabled: true

    cleaning:
      source_col: permit_class
      clean_col: permit_class_clean
      missing_values:
        - Not Identified
      replacements:
        Residential-Hotel: Other Special Residential
        Residential-Care-Assisted Living Facilities: Other Special Residential

    masking:
      source_col: permit_class_clean
      target_col: target_input
      true_col: target_true
      mask_col: is_masked
      mask_rate: 0.20
      seed: 42

    feature_cols:
      - building_type
      - permit_type
      - const_type
      - valuation_bucket
      - total_units_group
      - total_sf_nonzero

    algorithms:
      grouped_majority:
        enabled: true
        output_folder: baseline
        group_levels:
          - [building_type, permit_type]
          - [building_type]

      association_rules:
        enabled: true
        output_folder: association_rules
        min_support: 0.01
        min_confidence: 0.50
        min_lift: 1.00
        use_global_fallback: true
        top_n_rules: 50

      clustering:
        enabled: true
        output_folder: clustering
        n_clusters: 8
        random_state: 42
        n_init: 10

      knn:
        enabled: true
        output_folder: knn
        n_neighbors: 5
        weights: distance

    merge:
      enabled: true
      output_folder: merged
      strategy: majority_then_confidence
      minimum_confidence: 0.50
      auto_accept_single_candidate: true
      require_majority: false
      validation_record_status_col: validation_record_status
      review_validation_statuses:
        - suspicious
        - requires_review
      reject_validation_statuses: []
      record_id_col: raw_permit_id

plots:
  confusion_matrix:
    xlabel: Predicted label
    ylabel: True label
    figure_width: 8
    figure_height: 6
    dpi: 150
    x_label_rotation: 30
