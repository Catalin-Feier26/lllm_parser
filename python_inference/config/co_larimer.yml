source:
  name: larimer_countywide
  input:
    type: mongo
    collection: raw_permits
    parser_runs_collection: parser_runs
    uri_env: MONGO_URI
    database_env: MONGO_DB_NAME
    server_selection_timeout_ms: 5000
    parser_run_filter:
      source.state: CO
      source.county: Larimer
      parser.config_module: Config::Parser::co_larimer_countywide_pdf
    raw_permits_filter:
      source.state: CO
      source.county: Larimer
      source.municipality: CountyWide

output:
  base_dir: python_inference/output
  mongo:
    enabled: true
    uri_env: MONGO_URI
    database_env: MONGO_DB_NAME
    server_selection_timeout_ms: 5000
    collections:
      inference_runs: inference_runs
      inference_predictions: inference_predictions
      inference_decisions: inference_decisions
      validation_results: validation_results
      final_permits: final_permits

inference:
  mode: evaluation

preprocessing:
  normalize_strings: true

  keep_columns:
    - raw_permit_id
    - parser_run_id
    - input_file_id
    - output_csv_file_id
    - csv_row_number
    - permit_number
    - permit_type
    - status
    - issued_date
    - parcel_number
    - address
    - valuation
    - fee
    - owner_name
    - contractor_name

  normalization:
    enabled: true
    suffix: _normalized
    missing_values:
      - Not Identified
      - N/A
      - NA
      - NONE
      - "-"

    fields:
      permit_number:
        type: identifier
        required: true

      permit_type:
        type: text

      status:
        type: text

      issued_date:
        type: date

      parcel_number:
        type: identifier

      address:
        type: text

      valuation:
        type: money
        normalized_col: valuation_normalized
        min: 0
        suspicious_max: 10000000

      fee:
        type: money
        normalized_col: fee_normalized
        min: 0
        suspicious_max: 1000000

      owner_name:
        type: text

      contractor_name:
        type: text

  validation:
    enabled: true
    output_col: validation
    status_prefix: validation_

    important_fields:
      - permit_number
      - permit_type
      - status
      - issued_date
      - address

    missing_values:
      - Not Identified
      - N/A
      - NA
      - NONE
      - "-"

    fields:
      permit_number:
        type: identifier
        required: true

      permit_type:
        type: text

      status:
        type: text

      issued_date:
        type: date

      parcel_number:
        type: identifier

      address:
        type: text

      valuation:
        type: money
        min: 0
        suspicious_max: 10000000

      fee:
        type: money
        min: 0
        suspicious_max: 1000000

      owner_name:
        type: text

      contractor_name:
        type: text

  engineered_features:
    permit_number_category:
      enabled: true
      source_col: permit_number
      output_col: permit_number_category
      regex: '^\d{2}-([A-Z]+)'

    valuation_bucket:
      enabled: true
      source_col: valuation_normalized
      output_col: valuation_bucket

    fee_bucket:
      enabled: true
      source_col: fee_normalized
      output_col: fee_bucket

inference_targets:
  permit_type:
    enabled: true

    cleaning:
      source_col: permit_type
      clean_col: permit_type_clean
      missing_values:
        - Not Identified
        - N/A
        - NA
        - NONE
        - "-"
      replacements: {}

    masking:
      source_col: permit_type_clean
      target_col: permit_type_input
      true_col: permit_type_true
      mask_col: is_masked
      mask_rate: 0.40
      seed: 42

    feature_cols:
      - status
      - permit_number_category
      - valuation_bucket
      - fee_bucket

    algorithms:
      grouped_majority:
        enabled: true
        output_folder: baseline
        group_levels:
          - [permit_number_category, status]
          - [permit_number_category]
          - [status]

      association_rules:
        enabled: true
        output_folder: association_rules
        min_support: 0.01
        min_confidence: 0.50
        min_lift: 1.00
        use_global_fallback: true
        top_n_rules: 50

      clustering:
        enabled: true
        output_folder: clustering
        n_clusters: 6
        random_state: 42
        n_init: 10

      knn:
        enabled: true
        output_folder: knn
        n_neighbors: 5
        weights: distance

    merge:
      enabled: true
      output_folder: merged
      strategy: majority_then_confidence
      minimum_confidence: 0.50
      auto_accept_single_candidate: true
      require_majority: false
      validation_record_status_col: validation_record_status
      review_validation_statuses:
        - suspicious
        - requires_review
      reject_validation_statuses: []
      record_id_col: raw_permit_id

plots:
  confusion_matrix:
    xlabel: Predicted label
    ylabel: True label
    figure_width: 8
    figure_height: 6
    dpi: 150
    x_label_rotation: 30